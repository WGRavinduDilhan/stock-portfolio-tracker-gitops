apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-portfolio-tracker
  namespace: stock-portfolio
  spec:
  replicas: 2
  selector:
    matchLabels:
      app: stock-portfolio-tracker
  template:
    metadata:
      labels:
        app: stock-portfolio-tracker
    spec:
      containers:
        - name: stock-portfolio-tracker
          image: docker.io/ravindudilhan/stock-portfolio-tracker:1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi