apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stock-portfolio-tracker
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/WGRavinduDilhan/stock-portfolio-tracker-gitops.git
    targetRevision: main
    path: base
  destination:
    server: https://kubernetes.default.svc
    namespace: stock-portfolio
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true