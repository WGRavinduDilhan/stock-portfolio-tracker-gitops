apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stock-portfolio-tracker
  namespace: stock-portfolio
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stock-portfolio-tracker
                port:
                  number: 80